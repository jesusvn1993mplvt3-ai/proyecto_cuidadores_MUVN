<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Cuidados - CareLog</title>
    
    <!-- 1. Cargar Tailwind CSS (Estilos) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Cargar React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 3. Cargar Babel (Para que el navegador entienda React) -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <style>
        /* Animaciones suaves */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-20">

    <div id="root"></div>

    <!-- 4. Tu Código de la Aplicación -->
    <script type="text/babel">

        // --- ICONOS SVG (Versión manual para no depender de librerías externas complejas) ---
        const Icons = {
            Sun: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>,
            Moon: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>,
            User: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            CheckCircle: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            Clock: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            Send: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>,
            Trash2: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
            Activity: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>,
            AlertCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
            ClipboardList: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>
        };

        // --- DATOS DE EJEMPLO ---
        const CAREGIVERS = [
            "Ana Martínez", "Carlos Velázquez", "Beatriz Solís", "David López", "Elena Ramírez"
        ];

        const PATIENTS = [
            {
                id: 'p1',
                name: "Don Roberto (Diabetes/Hipertensión)",
                details: "Insulinodependiente. Riesgo de hipoglucemia nocturna.",
                tasks: {
                dia: [
                    { id: 't1_d1', text: "Toma de Glucosa (Ayunas)", type: "vital" },
                    { id: 't1_d2', text: "Administrar Insulina (NPH 15 uds)", type: "med" },
                    { id: 't1_d3', text: "Desayuno (Dieta baja en azúcar)", type: "food" },
                    { id: 't1_d4', text: "Toma de Presión Arterial", type: "vital" },
                    { id: 't1_d5', text: "Administrar Metformina 850mg", type: "med" }
                ],
                noche: [
                    { id: 't1_n1', text: "Cena ligera (7:00 PM)", type: "food" },
                    { id: 't1_n2', text: "Revisión de pañal (Incontinencia leve)", type: "check", note: "Asegurar que esté seco antes de dormir." },
                    { id: 't1_n3', text: "Administrar Insulina Nocturna", type: "med" },
                    { id: 't1_n4', text: "Revisar temperatura habitación (Frío)", type: "env", note: "Si hace frío, agregar manta extra. Despertar a las 3 AM para baño." }
                ]
                }
            },
            {
                id: 'p2',
                name: "Doña María (Alzheimer)",
                details: "Desorientación espacial. No dejar sola.",
                tasks: {
                dia: [
                    { id: 'p2_d1', text: "Administrar Memantina 10mg", type: "med" },
                    { id: 'p2_d2', text: "Aseo personal asistido", type: "hygiene" },
                    { id: 'p2_d3', text: "Ejercicios cognitivos (Memoria)", type: "activity" },
                    { id: 'p2_d4', text: "Hidratación (Vaso de agua)", type: "food" }
                ],
                noche: [
                    { id: 'p2_n1', text: "Administrar Quetiapina (Si está agitada)", type: "med" },
                    { id: 'p2_n2', text: "Subir barandales de la cama", type: "safety", note: "Riesgo de caídas al intentar levantarse." },
                    { id: 'p2_n3', text: "Revisión de sueño cada 2 horas", type: "check" },
                    { id: 'p2_n4', text: "Revisión de pañal (Cambio nocturno)", type: "hygiene", note: "Piel muy sensible, usar crema protectora." }
                ]
                }
            },
            {
                id: 'p3',
                name: "Sr. Pedro (Post-operatorio Cadera)",
                details: "Movilidad reducida. Riesgo de escaras.",
                tasks: {
                dia: [
                    { id: 'p3_d1', text: "Curación de herida quirúrgica", type: "nursing" },
                    { id: 'p3_d2', text: "Analgésico (Tramadol)", type: "med" },
                    { id: 'p3_d3', text: "Terapia física (Movimiento suave)", type: "activity" },
                    { id: 'p3_d4', text: "Cambio de posición (Cada 3 horas)", type: "check" }
                ],
                noche: [
                    { id: 'p3_n1', text: "Analgésico Nocturno", type: "med" },
                    { id: 'p3_n2', text: "Cambio de posición (Lado Izquierdo)", type: "check" },
                    { id: 'p3_n3', text: "Cambio de posición (Boca arriba)", type: "check" },
                    { id: 'p3_n4', text: "Revisar orina en bolsa recolectora", type: "check" }
                ]
                }
            }
        ];

        // --- COMPONENTE PRINCIPAL ---
        function App() {
            const [caregiver, setCaregiver] = React.useState("");
            const [shift, setShift] = React.useState("");
            const [patientId, setPatientId] = React.useState("");
            const [records, setRecords] = React.useState({});

            React.useEffect(() => {
                const saved = localStorage.getItem('careApp_data');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    setCaregiver(parsed.caregiver || "");
                    setShift(parsed.shift || "");
                    setPatientId(parsed.patientId || "");
                    setRecords(parsed.records || {});
                }
            }, []);

            React.useEffect(() => {
                const dataToSave = { caregiver, shift, patientId, records };
                localStorage.setItem('careApp_data', JSON.stringify(dataToSave));
            }, [caregiver, shift, patientId, records]);

            const handleTaskCheck = (taskId) => {
                const now = new Date();
                const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
                const dateString = now.toLocaleDateString([], {day: 'numeric', month: 'short'});

                setRecords(prev => {
                    const current = prev[taskId] || {};
                    if (current.checked) {
                        return { ...prev, [taskId]: { ...current, checked: false, time: null } };
                    } else {
                        return { ...prev, [taskId]: { ...current, checked: true, time: `${dateString}, ${timeString}` } };
                    }
                });
            };

            const handleTaskNote = (taskId, text) => {
                setRecords(prev => ({
                    ...prev,
                    [taskId]: { ...(prev[taskId] || {}), note: text }
                }));
            };

            const resetAll = () => {
                if(window.confirm("¿Estás seguro de borrar todos los datos del turno actual?")) {
                    setCaregiver("");
                    setShift("");
                    setPatientId("");
                    setRecords({});
                    localStorage.removeItem('careApp_data');
                }
            };

            const generateWhatsAppLink = () => {
                if (!caregiver || !shift || !patientId) {
                    alert("Por favor completa la información básica antes de enviar.");
                    return;
                }

                const patient = PATIENTS.find(p => p.id === patientId);
                const taskList = patient.tasks[shift] || [];
                
                let message = `📋 *REPORTE DE CUIDADO DIARIO*\n`;
                message += `📅 *Fecha:* ${new Date().toLocaleDateString()}\n`;
                message += `👤 *Cuidador:* ${caregiver}\n`;
                message += `🌗 *Turno:* ${shift === 'dia' ? '☀️ Mañana/Tarde' : '🌙 Noche'}\n`;
                message += `👴 *Paciente:* ${patient.name}\n\n`;
                message += `✅ *ACTIVIDADES REALIZADAS:*\n`;
                
                let completedCount = 0;
                taskList.forEach(task => {
                    const rec = records[task.id];
                    if (rec && rec.checked) {
                        completedCount++;
                        message += `🔹 *${task.text}*\n`;
                        message += `   🕒 Hora: ${rec.time}\n`;
                        if (rec.note) message += `   📝 Obs: ${rec.note}\n`;
                    }
                });

                if (completedCount === 0) message += `   (Ninguna actividad registrada aún)\n`;

                message += `\n⚠️ *PENDIENTES / NO REALIZADOS:*\n`;
                taskList.forEach(task => {
                    const rec = records[task.id];
                    if (!rec || !rec.checked) {
                        message += `🔸 ${task.text}`;
                        if (rec && rec.note) message += ` (Obs: ${rec.note})`;
                        message += `\n`;
                    }
                });

                const encodedMsg = encodeURIComponent(message);
                window.open(`https://wa.me/524451586270?text=${encodedMsg}`, '_blank');
            };

            const currentPatient = PATIENTS.find(p => p.id === patientId);
            const currentTasks = (currentPatient && shift) ? currentPatient.tasks[shift] : [];

            return (
                <div className="max-w-3xl mx-auto">
                    {/* HEADER */}
                    <header className="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10 rounded-b-xl">
                        <div className="flex justify-between items-center">
                            <div>
                                <h1 className="text-xl font-bold flex items-center gap-2">
                                    <Icons.Activity />
                                    CareLog
                                </h1>
                                <p className="text-xs text-blue-100">Registro Clínico Diario</p>
                            </div>
                            <button 
                                onClick={resetAll}
                                className="bg-red-500 hover:bg-red-600 text-white p-2 rounded-lg text-xs flex items-center gap-1 transition-colors shadow-sm"
                            >
                                <Icons.Trash2 />
                                Reiniciar
                            </button>
                        </div>
                    </header>

                    <main className="p-4 space-y-6">

                        {/* 1. SELECCIÓN DE CUIDADOR */}
                        <section className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                            <label className="block text-sm font-semibold text-gray-600 mb-2 flex items-center gap-2">
                                <Icons.User />
                                Selecciona Cuidador
                            </label>
                            <select 
                                value={caregiver} 
                                onChange={(e) => setCaregiver(e.target.value)}
                                className="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg text-lg focus:ring-2 focus:ring-blue-500 outline-none"
                            >
                                <option value="">-- Elige tu nombre --</option>
                                {CAREGIVERS.map(c => <option key={c} value={c}>{c}</option>)}
                            </select>
                        </section>

                        {/* 2. SELECCIÓN DE TURNO */}
                        <section className="grid grid-cols-2 gap-4">
                            <button 
                                onClick={() => setShift('dia')}
                                className={`p-4 rounded-xl border-2 flex flex-col items-center justify-center gap-2 transition-all ${shift === 'dia' ? 'border-orange-400 bg-orange-50 text-orange-700' : 'border-gray-200 bg-white text-gray-400'}`}
                            >
                                <div className={shift === 'dia' ? 'text-orange-500' : ''}>
                                    <Icons.Sun />
                                </div>
                                <span className="font-bold">Turno Día</span>
                            </button>
                            <button 
                                onClick={() => setShift('noche')}
                                className={`p-4 rounded-xl border-2 flex flex-col items-center justify-center gap-2 transition-all ${shift === 'noche' ? 'border-indigo-500 bg-indigo-50 text-indigo-700' : 'border-gray-200 bg-white text-gray-400'}`}
                            >
                                <div className={shift === 'noche' ? 'text-indigo-600' : ''}>
                                    <Icons.Moon />
                                </div>
                                <span className="font-bold">Turno Noche</span>
                            </button>
                        </section>

                        {/* 3. SELECCIÓN DE PACIENTE */}
                        <section className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                           <label className="block text-sm font-semibold text-gray-600 mb-2 flex items-center gap-2">
                                <Icons.ClipboardList />
                                Selecciona Paciente
                            </label>
                            <div className="space-y-2">
                                {PATIENTS.map(p => (
                                <button
                                    key={p.id}
                                    onClick={() => setPatientId(p.id)}
                                    className={`w-full text-left p-3 rounded-lg border transition-all ${patientId === p.id ? 'border-blue-500 bg-blue-50 ring-1 ring-blue-500' : 'border-gray-200 hover:bg-gray-50'}`}
                                >
                                    <div className="font-bold text-gray-800">{p.name}</div>
                                    {patientId === p.id && (
                                    <div className="text-xs text-blue-600 mt-1">{p.details}</div>
                                    )}
                                </button>
                                ))}
                            </div>
                        </section>

                        {/* 4. LISTA DE TAREAS DINÁMICAS */}
                        {caregiver && shift && patientId && (
                            <section className="space-y-4 animate-fade-in">
                                <div className="flex items-center gap-2 mb-2">
                                    <h2 className="text-lg font-bold text-gray-800">
                                        Lista de Obligaciones ({shift === 'dia' ? 'Día' : 'Noche'})
                                    </h2>
                                    <span className="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full font-medium">
                                        {currentTasks.length} Tareas
                                    </span>
                                </div>

                                {currentTasks.map((task) => {
                                    const record = records[task.id] || {};
                                    const isChecked = record.checked || false;

                                    let borderClass = "border-gray-200";
                                    if (task.type === 'med') borderClass = "border-l-4 border-l-red-400";
                                    if (task.type === 'vital') borderClass = "border-l-4 border-l-green-400";
                                    if (task.type === 'check') borderClass = "border-l-4 border-l-purple-400";
                                    if (task.type === 'env') borderClass = "border-l-4 border-l-blue-400";

                                    return (
                                        <div key={task.id} className={`bg-white rounded-lg shadow-sm border p-4 ${borderClass} transition-all ${isChecked ? 'bg-gray-50' : ''}`}>
                                            <div className="flex items-start gap-3">
                                                <button
                                                    onClick={() => handleTaskCheck(task.id)}
                                                    className={`mt-1 flex-shrink-0 w-8 h-8 rounded-full border-2 flex items-center justify-center transition-all ${isChecked ? 'bg-green-500 border-green-500 text-white' : 'border-gray-300 text-transparent hover:border-green-400'}`}
                                                >
                                                    <Icons.CheckCircle className={isChecked ? "opacity-100" : "opacity-0"} />
                                                </button>
                                                
                                                <div className="flex-1">
                                                    <h3 className={`font-medium text-gray-800 text-lg leading-tight ${isChecked ? 'line-through text-gray-400' : ''}`}>
                                                        {task.text}
                                                    </h3>
                                                    
                                                    {task.note && (
                                                        <div className="mt-1 flex items-start gap-1 text-sm text-amber-600 bg-amber-50 p-2 rounded">
                                                            <div className="mt-0.5"><Icons.AlertCircle /></div>
                                                            <span>{task.note}</span>
                                                        </div>
                                                    )}

                                                    {isChecked && record.time && (
                                                        <div className="mt-2 inline-flex items-center gap-1 text-xs font-bold text-green-700 bg-green-100 px-2 py-1 rounded">
                                                            <Icons.Clock />
                                                            Completado: {record.time}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>

                                            <div className="mt-3 pl-11">
                                                <textarea
                                                    placeholder="Observaciones..."
                                                    value={record.note || ""}
                                                    onChange={(e) => handleTaskNote(task.id, e.target.value)}
                                                    className="w-full text-sm p-2 border border-gray-200 rounded-md focus:ring-1 focus:ring-blue-400 outline-none resize-none bg-gray-50 focus:bg-white"
                                                    rows={2}
                                                />
                                            </div>
                                        </div>
                                    );
                                })}
                            </section>
                        )}

                    </main>

                    {/* FOOTER */}
                    {caregiver && shift && patientId && (
                        <div className="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 p-4 shadow-lg z-20">
                            <div className="max-w-3xl mx-auto">
                                <button
                                    onClick={generateWhatsAppLink}
                                    className="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-xl shadow-md flex items-center justify-center gap-2 text-lg transition-transform active:scale-95"
                                >
                                    <Icons.Send />
                                    Enviar Reporte
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
