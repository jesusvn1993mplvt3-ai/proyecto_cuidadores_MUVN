        const getTodayStr = () => new Date().toISOString().split('T')[0];
        
        const getCalendarRange = () => {
            const dates = [];
            const today = new Date();
            for (let i = -15; i <= 15; i++) {
                const d = new Date(today);
                d.setDate(today.getDate() + i);
                dates.push(d.toISOString().split('T')[0]);
            }
            return dates;
        };

        const isEditable = (dateStr, shift) => {
            const now = new Date();
            const recordDate = new Date(dateStr + "T12:00:00");
            const today = new Date(getTodayStr() + "T12:00:00");

            if (recordDate > today) return false;
            
            if (recordDate < today) {
                const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
                // Comparar solo fechas (sin hora)
                const isYesterday = recordDate.toISOString().split('T')[0] === yesterday.toISOString().split('T')[0];
                if (isYesterday && shift === 'noche' && now.getHours() < 9) return true;
                return false;
            }

            const currentHour = now.getHours();
            if (shift === 'dia') return currentHour < 21; 
            if (shift === 'noche') return true; 
            return false;
        };

                const unsubscribe = db.collection("asignaciones")
                    .onSnapshot(snapshot => {
                        const data = {};
                        snapshot.docs.forEach(doc => {
                            const dayAssignments = doc.data();
                            if (dayAssignments[user.name]) {
                                data[doc.id] = dayAssignments[user.name];
                            }
                        });
                        setMyAssignments(data);
                        setLoading(false);

            return (

        function DailyLog({ user, date, assignment, onBack }) {
            const [records, setRecords] = React.useState({});
            const [obs, setObs] = React.useState("");
            const [saving, setSaving] = React.useState(false);

            const patient = PATIENTS.find(p => p.id === assignment.patientId);
            const canEdit = isEditable(date, assignment.shift);
            const docId = `${date}_${assignment.shift}_${assignment.patientId}`;

            React.useEffect(() => {
                const unsubscribe = db.collection("registros_diarios").doc(docId).onSnapshot(doc => {
                    if (doc.exists) {
                        setRecords(doc.data().records || {});
                        setObs(doc.data().generalObservation || "");
                    }
                });
                return () => unsubscribe();
            }, [docId]);

            const handleToggle = async (taskId) => {
                if (!canEdit) return;
                const now = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const current = records[taskId] || {};
                const newRec = { ...records, [taskId]: { ...current, checked: !current.checked, completedAt: !current.checked ? now : null } };
                setRecords(newRec); // Optimistic
                
                await db.collection("registros_diarios").doc(docId).set({
                    date, shift: assignment.shift, patientId: assignment.patientId, caregiver: user.name,
                    lastUpdate: firebase.firestore.Timestamp.now(),
                    records: newRec, generalObservation: obs
                }, { merge: true });
            };

            const saveObs = async () => {
                if(!canEdit) return;
                setSaving(true);
                await db.collection("registros_diarios").doc(docId).set({ generalObservation: obs }, { merge: true });
                setSaving(false);
            };

            if (!patient) return <div className="p-10 text-white">Error: Paciente no encontrado</div>;

            return (
                <div className="min-h-screen bg-slate-900 pb-20 fade-in">
                    <div className={`sticky top-0 z-20 p-4 flex justify-between items-center shadow-md ${canEdit ? 'bg-[#0AB2BB]' : 'bg-slate-700'}`}>
                        <button onClick={onBack} className="text-white font-bold text-xl flex items-center"><Icons.Back/> Atrás</button>
                        <div className="text-center text-white">
                            <h2 className="font-bold text-lg">{date}</h2>
                            <p className="text-xs uppercase opacity-90">{assignment.shift} - {canEdit ? 'EDITANDO' : 'SOLO LECTURA'}</p>
                        </div>
                        <div className="w-8"></div>
                    </div>

                    <div className="p-4 max-w-2xl mx-auto space-y-6">
                        <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                            <h3 className="text-[#0AB2BB] font-bold text-lg">{patient.name}</h3>
                            <p className="text-slate-400 text-sm mb-2">{patient.condition}</p>
                            <div className="bg-slate-900 p-2 rounded text-xs text-slate-300">
                                📍 {patient.info.address} <br/>
                                🚑 {patient.info.emergency}
                            </div>
                        </div>

                        <div>
                            <h4 className="text-white font-bold mb-3 uppercase text-sm tracking-wider">Actividades</h4>
                            <div className="space-y-3">
                                {patient.tasks[assignment.shift].map(task => {
                                    const rec = records[task.id] || {};
                                    return (
                                        <div key={task.id} 
                                            onClick={() => handleToggle(task.id)}
                                            className={`p-4 rounded-xl border flex items-center justify-between transition-all ${rec.checked ? 'bg-[#0AB2BB]/10 border-[#0AB2BB]' : 'bg-slate-800 border-slate-700'} ${canEdit ? 'cursor-pointer active:scale-95' : 'opacity-70'}`}
                                        >
                                            <div>
                                                <div className={`font-medium ${rec.checked ? 'text-[#0AB2BB] line-through' : 'text-white'}`}>{task.text}</div>
                                                {rec.checked && <div className="text-xs text-[#0AB2BB] font-bold">Completado: {rec.completedAt}</div>}
                                            </div>
                                            <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center ${rec.checked ? 'bg-[#0AB2BB] border-[#0AB2BB]' : 'border-slate-500'}`}>
                                                {rec.checked && <span className="text-white text-xs">✓</span>}
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>

                        <div>
                            <h4 className="text-white font-bold mb-3 uppercase text-sm tracking-wider">Bitácora</h4>
                            <textarea 
                                className={`w-full bg-slate-800 border ${canEdit ? 'border-slate-600 focus:border-[#0AB2BB]' : 'border-slate-800'} rounded-xl p-3 text-white outline-none h-32`}
                                placeholder={canEdit ? "Escribe novedades del turno..." : "Sin observaciones"}
                                value={obs}
                                onChange={(e) => setObs(e.target.value)}
                                onBlur={saveObs}
                                readOnly={!canEdit}
                            ></textarea>
                            {saving && <span className="text-xs text-[#0AB2BB] animate-pulse">Guardando...</span>}
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [user, setUser] = React.useState(null);
            const [view, setView] = React.useState("login");
            const [currentShiftData, setCurrentShiftData] = React.useState(null);

            const handleLogin = (u) => {
                setUser(u);
                if (u.role === 'admin') setView("admin");
                else setView("calendar");
            };

            const handleLogout = () => {
                setUser(null);
                setView("login");
                setCurrentShiftData(null);
            };

            return (
                <div className="relative">
                    {view === "login" && <LoginScreen onLogin={handleLogin} />}
                    {view === "admin" && <AdminPanel user={user} onLogout={handleLogout} />}
                    {view === "calendar" && <CaregiverCalendar user={user} onLogout={handleLogout} onSelectShift={(d, a) => { setCurrentShiftData({date: d, assignment: a}); setView("log"); }} />}
                    {view === "log" && <DailyLog user={user} date={currentShiftData.date} assignment={currentShiftData.assignment} onBack={() => setView("calendar")} />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
